[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guidance-watch"
version = "0.1.0"
description = "EDGAR Earnings-Guidance Watch Agent — research MVP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Oscar Silva" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "typer>=0.12",
  "rich>=13.7",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-beautifulsoup4>=4.12",
]
finbert = [
  "transformers>=4.41",
  "torch>=2.3",
]
phoenix = [
  "arize-phoenix>=4.0",
  "openinference-instrumentation>=0.1",
]
live = [
  "openai>=1.30",
]

[project.scripts]
guidance-watch = "guidance_watch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/guidance_watch"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/guidance_watch", "README.md", "mvp_implementation_plan.md"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["guidance_watch"]

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast pure unit tests",
  "integration: integration tests with fakes/mocks",
  "eval: fixture-based evaluation suite",
  "live: requires network and/or credentials (deselected by default)",
]
addopts = "-q -m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]
